version: 2

project_name: farol

before:
  hooks:
    - go mod tidy

builds:
  - id: farol
    binary: farol
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # The same stamp the Makefile applies, so a released binary and a local
    # `make build` answer --version the same way. .Version is the tag with
    # the leading v stripped, so put it back.
    ldflags:
      - -s -w -X github.com/filipemolina/farol/src/constants.version=v{{ .Version }}

# No Windows build for now — re-evaluate once phase 7's details screen lands
# its $EDITOR handover.

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^Merge branch"

release:
  draft: true
  # Drafted rather than published: the first releases want a human to read
  # the notes before they go out.
  prerelease: auto
